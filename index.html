
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ESP32 Messages</title>
</head>
<body>
  <h1>ESP32 Messages</h1>

  <h2>Statut de l'ESP32</h2>
  <p id="statut" style="font-size:24px; font-weight:bold;">...</p>

  <h2>Envoyer à l'ESP32</h2>
  <input id="texte" placeholder="Votre message">
  <button onclick="envoyer()">Envoyer</button>

  <h2>Reçu de l'ESP32</h2>
  <p id="recu">...</p>

  <script>
    function envoyer() {
      const message = document.getElementById("texte").value;
      fetch("/envoyer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });
    }

    // Toutes les 2 secondes : message reçu de l'ESP32
    setInterval(async () => {
      const reponse = await fetch("/recevoir");
      document.getElementById("recu").innerText = await reponse.text();
    }, 2000);

    // Chaque seconde : statut de l'ESP32
    setInterval(async () => {
      const reponse = await fetch("/statut");
      const statut = await reponse.text();
      const element = document.getElementById("statut");
      if (statut === "en ligne") {
        element.innerText = "🟢 En ligne";
        element.style.color = "green";
      } else {
        element.innerText = "🔴 Hors ligne";
        element.style.color = "red";
      }
    }, 1000);
  </script>
</body>
</html>
